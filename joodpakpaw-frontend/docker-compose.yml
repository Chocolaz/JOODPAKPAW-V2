version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* vars must be build args — they are inlined into JS at build time
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    container_name: joodpakpaw-frontend
    ports:
      - '3000:3000'
    networks:
      - joodpakpaw-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  joodpakpaw-network:
    external: true
