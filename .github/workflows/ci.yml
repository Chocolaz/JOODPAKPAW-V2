name: JoodPakPaw CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ml-tests:
    name: ML Service Tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: joodpakpaw-ml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: joodpakpaw-ml/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest suite
        run: pytest -v

  api-build:
    name: Backend API Typecheck & Build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: joodpakpaw-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: joodpakpaw-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build API
        run: npx tsc

  frontend-build:
    name: Frontend Lint, Typecheck & Build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: joodpakpaw-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: joodpakpaw-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint (non-blocking report)
        continue-on-error: true
        run: npm run lint

      - name: Generate Next.js types (next-env.d.ts)
        run: npx next typegen

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build Next.js production bundle
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_BASE_PATH: ''
        run: npm run build
