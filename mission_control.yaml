# ==============================================================================
# JoodPakPaw Multi-Agent Mission Control Configuration (mission_control.yaml)
# ==============================================================================
# กำหนดสายพานการทำงาน (Workflow / Chain of Agents), กฎการส่งต่องาน (Handoffs),
# ตาราง Sprint 0-4 (PBI-01 ถึง PBI-21) และข้อความ Atomic Git Commit ประจำแต่ละ PBI
# ==============================================================================

version: "2.2"
project:
  name: "JoodPakPaw - Community Pet Boarding Platform (V2 Monorepo)"
  workspace_root: "d:/Project/joodpakpaw"
  frontend_dir: "d:/Project/joodpakpaw/joodpakpaw-frontend"
  backend_dir: "d:/Project/joodpakpaw/joodpakpaw-api"
  ml_dir: "d:/Project/joodpakpaw/joodpakpaw-ml"
  blueprint_doc: "d:/Project/joodpakpaw/docs/JoodPakPaw_V2_Blueprint.md"
  backlog_doc: "d:/Project/joodpakpaw/docs/BACKLOG_AND_GIT_PLAN.md"
  rules_file: "d:/Project/joodpakpaw/AGENTS.md"

# ------------------------------------------------------------------------------
# 1. Git Monorepo & 1-PBI-per-Commit Policy
# ------------------------------------------------------------------------------
git_policy:
  repository_mode: "single_monorepo"
  root_path: "d:/Project/joodpakpaw"
  branches:
    production: "main"
    integration: "develop"
    phase_prefix: "feat/phase-"
  commit_granularity: "1_pbi_equals_1_atomic_commit"
  merge_granularity: "1_sprint_phase_merges_into_develop"
  rules:
    - "ห้ามแก้ไขหรือ Commit ลงกิ่ง main โดยตรง"
    - "1 Phase = 1 Sprint = 1 Feature Branch แตกจาก develop (เช่น feat/phase-0-db-infra)"
    - "1 PBI = 1 Atomic Git Commit เมื่อผ่านการตรวจจาก qa-auditor (STATUS: PASS) เท่านั้น"
    - "Builder Agents ห้ามรัน git commit, git merge หรือ git push เองเด็ดขาด"
    - "เมื่อครบทุก PBI ใน Sprint จึง Merge กิ่ง feat/phase-* เข้าสู่ develop (--no-ff)"
    - "ห้ามรัน git push อัตโนมัติจนกว่าผู้ใช้จะสั่ง"

deployment_compatibility:
  local_mode: "Docker Compose (joodpakpaw-postgres, joodpakpaw-redis, joodpakpaw-minio, joodpakpaw-api, joodpakpaw-ml, joodpakpaw-frontend)"
  free_cloud_targets:
    frontend: "Vercel (Free Hobby Tier - Root Path '/')"
    database: "Supabase Free Tier / Neon Serverless Postgres (via DATABASE_URL)"
    storage: "Cloudflare R2 Free 10GB / Supabase S3 Storage (via S3-compatible SDK)"
    cache_and_queue: "Upstash Free Redis OR automatic In-Memory Cache + node-cron fallback when REDIS_URL is empty"
    backend_and_ml: "Render / Koyeb Free Web Service (joodpakpaw-api) + Hugging Face Spaces / Render Free (joodpakpaw-ml) with cold-start fallback in API"

# ------------------------------------------------------------------------------
# 2. Agent Definitions & Assigned Skills
# ------------------------------------------------------------------------------
agents:
  orchestrator:
    id: "main-pm-orchestrator"
    role: "Product Manager, Lead Orchestrator & Git Gatekeeper"
    mode: "planning_and_delegation"
    responsibilities:
      - "แตกงานตาม Sprint 0-4 (PBI-01 ถึง PBI-21), สร้างกิ่ง feat/phase-* และควบคุมลำดับการทำงานของ Subagents"
      - "ส่งต่องานของแต่ละ PBI จาก Builder Agent ไปยัง qa-auditor เสมอ ไม่ข้ามขั้นตอนการตรวจทาน"
      - "เมื่อ qa-auditor ให้ผ่าน (PASS) ในแต่ละ PBI จึงอัปเดตสถานะใน docs/BACKLOG_AND_GIT_PLAN.md และรัน git commit ตามข้อความที่กำหนด"

  builders:
    - id: "db-infra-architect"
      role: "Database & Infrastructure Architect"
      model: "inherit"
      workspace: "inherit"
      required_skills:
        - ".agents/skills/joodpakpaw-db-schema/SKILL.md"
      owned_paths:
        - "docker-compose.yml"
        - "joodpakpaw-api/prisma/**"
        - "joodpakpaw-api/src/database/**"
        - "infra/**"

    - id: "backend-core-engineer"
      role: "Core Backend & Real-Time Engineer"
      model: "inherit"
      workspace: "inherit"
      required_skills:
        - ".agents/skills/joodpakpaw-api-contract/SKILL.md"
      owned_paths:
        - "joodpakpaw-api/src/**"
        - "joodpakpaw-api/package.json"
        - "joodpakpaw-api/Dockerfile"

    - id: "ml-recommendation-engineer"
      role: "Machine Learning & Recommendation Engineer"
      model: "inherit"
      workspace: "inherit"
      required_skills:
        - ".agents/skills/joodpakpaw-ml-hybrid/SKILL.md"
      owned_paths:
        - "joodpakpaw-ml/**"

    - id: "frontend-upgrader"
      role: "Frontend Product Upgrader"
      model: "inherit"
      workspace: "inherit"
      required_skills:
        - ".agents/skills/joodpakpaw-fe-upgrader/SKILL.md"
      owned_paths:
        - "joodpakpaw-frontend/**"

  reviewers:
    - id: "qa-auditor"
      role: "Independent QA Auditor & Security Reviewer"
      model: "inherit"
      workspace: "inherit"
      write_production_code: false
      required_skills:
        - ".agents/skills/joodpakpaw-qa-auditor/SKILL.md"
      audit_domains:
        - "API Contract & DTO Parity with joodpakpaw-frontend/types/*.ts"
        - "Custom Error Code Compliance (T-2007, A-3001..A-3012, DB-1002, FF-4101)"
        - "Race Condition & Concurrency (Room Booking & Real-Time Chat)"
        - "RBAC, JWT & IDOR Security Verification"
        - "Admin Ban & Appeal State Machine (TC-151 to TC-155)"
        - "Git Diff Hygiene & Zero-'catbnb' / Free-Tier Cloud Readiness Check"

# ------------------------------------------------------------------------------
# 3. Sprint & PBI Pipeline (Sprint 0 to Sprint 4 | PBI-01 to PBI-21)
# ------------------------------------------------------------------------------
sprints:
  - sprint_id: "sprint_0"
    phase_id: "phase_0_infra_and_db"
    branch: "feat/phase-0-db-infra"
    name: "Phase 0 / Sprint 0: Foundation, Monorepo Infra & Database Schema"
    merge_commit: "chore(sprint-0): merge phase 0 database and infrastructure into develop"
    pbis:
      - id: "PBI-01"
        title: "Docker Compose & joodpakpaw-api Skeleton"
        builder: "db-infra-architect"
        reviewer: "qa-auditor"
        commit_message: "feat(infra): [PBI-01] setup joodpakpaw docker-compose and api project skeleton"
      - id: "PBI-02"
        title: "Complete 41-Table PostgreSQL Schema & Migrations"
        builder: "db-infra-architect"
        reviewer: "qa-auditor"
        commit_message: "feat(db): [PBI-02] implement complete postgresql schema, constraints, and indexes"
      - id: "PBI-03"
        title: "Master Lookup & Demo Seed Data"
        builder: "db-infra-architect"
        reviewer: "qa-auditor"
        commit_message: "feat(seed): [PBI-03] add master lookup seed data and demo accounts/properties"

  - sprint_id: "sprint_1"
    phase_id: "phase_1_auth_user_property"
    branch: "feat/phase-1-auth-property"
    depends_on: ["sprint_0"]
    name: "Phase 1 / Sprint 1: Auth, User, Property/Room CRUD & Cloud Storage"
    merge_commit: "chore(sprint-1): merge phase 1 auth, user, property CRUD, and S3 WebP pipeline into develop"
    pbis:
      - id: "PBI-04"
        title: "Authentication & Password Policy API (/api/v1/auth/*)"
        builder: "backend-core-engineer"
        reviewer: "qa-auditor"
        commit_message: "feat(auth): [PBI-04] implement JWT auth, OTP verification, and password reset APIs"
      - id: "PBI-05"
        title: "S3 WebP Storage Adapter & User Profile API (/api/v1/users/*)"
        builder: "backend-core-engineer"
        reviewer: "qa-auditor"
        commit_message: "feat(users): [PBI-05] implement S3 WebP storage adapter and user profile APIs"
      - id: "PBI-06"
        title: "Master Lookups & Public Property Discovery API (/api/v1/properties/*)"
        builder: "backend-core-engineer"
        reviewer: "qa-auditor"
        commit_message: "feat(properties): [PBI-06] implement lookup endpoints and public property search APIs"
      - id: "PBI-07"
        title: "Host Property & Room Category CRUD API (/api/v1/hosts/properties/*)"
        builder: "backend-core-engineer"
        reviewer: "qa-auditor"
        commit_message: "feat(host): [PBI-07] implement host property and room category CRUD APIs"
      - id: "PBI-08"
        title: "Frontend Core & Client WebP Upgrade (Root Path '/' for Vercel & imageCompression.ts)"
        builder: "frontend-upgrader"
        reviewer: "qa-auditor"
        commit_message: "feat(fe-core): [PBI-08] configure root path for Vercel and add client-side WebP compression"

  - sprint_id: "sprint_2"
    phase_id: "phase_2_booking_calendar_favorites"
    branch: "feat/phase-2-booking-calendar"
    depends_on: ["sprint_1"]
    name: "Phase 2 / Sprint 2: Booking Engine, Host Calendar UI, Pets, Favorites & Reviews"
    merge_commit: "chore(sprint-2): merge phase 2 booking engine, host calendar UI, pets, favorites, and reviews into develop"
    pbis:
      - id: "PBI-09"
        title: "Pet Profile CRUD API with Active-Booking Guard (/api/v1/profiles/pet-profiles/*)"
        builder: "backend-core-engineer"
        reviewer: "qa-auditor"
        commit_message: "feat(pets): [PBI-09] implement pet profile CRUD APIs with active-booking deletion guard"
      - id: "PBI-10"
        title: "Room Availability Search & Row-Locked Multi-Room Booking Engine"
        builder: "backend-core-engineer"
        reviewer: "qa-auditor"
        commit_message: "feat(booking): [PBI-10] implement room search and row-locked multi-room booking engine"
      - id: "PBI-11"
        title: "Booking Payment, Cancel & Host Booking Management API"
        builder: "backend-core-engineer"
        reviewer: "qa-auditor"
        commit_message: "feat(booking-flow): [PBI-11] implement payment confirmation, cancellation, checkout, and host booking APIs"
      - id: "PBI-12"
        title: "Host Room Availability & Dynamic Pricing Calendar (API + UI)"
        builder: "backend-core-engineer + frontend-upgrader"
        reviewer: "qa-auditor"
        commit_message: "feat(calendar): [PBI-12] implement host room availability and daily pricing calendar API and UI"
      - id: "PBI-13"
        title: "Favorite Folders (FF-4101) & Booking Review System"
        builder: "backend-core-engineer"
        reviewer: "qa-auditor"
        commit_message: "feat(favorites-reviews): [PBI-13] implement favorite folders with FF-4101 and booking review system"

  - sprint_id: "sprint_3"
    phase_id: "phase_3_realtime_verification_admin"
    branch: "feat/phase-3-realtime-admin"
    depends_on: ["sprint_2"]
    name: "Phase 3 / Sprint 3: Real-Time Socket.IO, Chat, KYC & Admin Backoffice"
    merge_commit: "chore(sprint-3): merge phase 3 real-time socket, chat, KYC, and admin system into develop"
    pbis:
      - id: "PBI-14"
        title: "Socket.IO v4 Server, Notifications & Check-in Reminder Scheduler"
        builder: "backend-core-engineer"
        reviewer: "qa-auditor"
        commit_message: "feat(notifications): [PBI-14] implement Socket.IO server, notification APIs, and check-in reminder scheduler"
      - id: "PBI-15"
        title: "Real-Time Chat Rooms & Messaging API (/api/v1/chat-rooms/*)"
        builder: "backend-core-engineer"
        reviewer: "qa-auditor"
        commit_message: "feat(chat): [PBI-15] implement real-time chat rooms and messaging APIs with Socket.IO"
      - id: "PBI-16"
        title: "Frontend Real-Time & Notification Read State Sync Upgrade"
        builder: "frontend-upgrader"
        reviewer: "qa-auditor"
        commit_message: "feat(fe-realtime): [PBI-16] upgrade socket client to WebSocket transport and sync notification read state"
      - id: "PBI-17"
        title: "Host KYC Verification Workflow (/api/v1/user-verifications/* & Admin review)"
        builder: "backend-core-engineer"
        reviewer: "qa-auditor"
        commit_message: "feat(kyc): [PBI-17] implement host KYC verification submission and admin review workflow"
      - id: "PBI-18"
        title: "Report System, Cascading Admin Ban/Appeal State Machine & Action Logs"
        builder: "backend-core-engineer"
        reviewer: "qa-auditor"
        commit_message: "feat(admin): [PBI-18] implement report system, cascading ban/appeal state machine, and admin dashboard"

  - sprint_id: "sprint_4"
    phase_id: "phase_4_ml_hybrid_and_e2e"
    branch: "feat/phase-4-ml-hybrid"
    depends_on: ["sprint_3"]
    name: "Phase 4 / Sprint 4: Hybrid ML Service (joodpakpaw-ml) & Production Polish"
    merge_commit: "chore(sprint-4): merge phase 4 hybrid ML service and frontend optimization into develop"
    pbis:
      - id: "PBI-19"
        title: "joodpakpaw-ml 3-Stage Pet-Aware Hybrid Recommendation Service"
        builder: "ml-recommendation-engineer"
        reviewer: "qa-auditor"
        commit_message: "feat(ml): [PBI-19] implement joodpakpaw-ml FastAPI 3-stage pet-aware hybrid recommendation service"
      - id: "PBI-20"
        title: "Backend ML Integration & 1.5s Cold-Start Fallback"
        builder: "backend-core-engineer"
        reviewer: "qa-auditor"
        commit_message: "feat(api-ml): [PBI-20] integrate recommendation endpoints with 1.5s cold-start fallback"
      - id: "PBI-21"
        title: "Frontend Home Feed Optimization & Free Cloud Deployment Guide"
        builder: "frontend-upgrader"
        reviewer: "qa-auditor"
        commit_message: "feat(fe-perf): [PBI-21] optimize home feed requests and add free-tier cloud deployment guide"
